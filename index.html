<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PulseGuard — Cardiovascular Telemetry</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Print Stylesheet: Isolates the Clinical Summary Document */
    @media screen {
      #clinical-report-root {
        display: none;
      }
    }

    @media print {
      body * {
        visibility: hidden !important;
      }

      #clinical-report-root, #clinical-report-root * {
        visibility: visible !important;
      }

      #clinical-report-root {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 0;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      @page {
        size: letter portrait;
        margin: 0.35in 0.45in;
      }

      tr {
        page-break-inside: avoid;
      }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .notch-safe {
      padding-top: max(1rem, env(safe-area-inset-top, 16px));
    }
  </style>
</head>
<body class="min-h-screen bg-[#020617] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-black text-slate-200 font-sans selection:bg-cyan-500/30">

  <div class="max-w-4xl mx-auto flex flex-col min-h-screen p-4 sm:p-6 notch-safe">
    
    <!-- App Header -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800/70">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="activity" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-400">PulseGuard</h1>
          <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Hemodynamic Telemetry Log</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button 
          onclick="exportClinicalPDF()" 
          class="flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold rounded-xl text-xs transition-all shadow-lg shadow-blue-950/40 border border-blue-400/30"
          title="Generate Clean Single-Page Report for Physician"
        >
          <i data-lucide="file-text" class="w-4 h-4 text-blue-200"></i>
          <span>Export Clinical PDF</span>
        </button>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="grid grid-cols-1 md:grid-cols-12 gap-6 mt-6 flex-1">
      
      <!-- Input Panel (AutoClear Enabled) -->
      <section class="md:col-span-5 bg-slate-900/50 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-5 shadow-2xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xs font-mono uppercase tracking-widest text-slate-400 flex items-center gap-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4 text-cyan-400"></i> Log Reading
            </h2>
            <span class="text-[10px] font-mono text-slate-500" id="live-time-hint">Ready</span>
          </div>

          <form id="reading-form" onsubmit="handleSaveReading(event)" class="space-y-4">
            <!-- Systolic & Diastolic Inputs with AutoClear -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1.5">Systolic (Top)</label>
                <div class="relative">
                  <input 
                    type="number" 
                    id="input-sys" 
                    placeholder="120" 
                    inputmode="numeric" 
                    onfocus="this.value = ''" 
                    required
                    class="w-full bg-slate-950/70 border border-slate-700/80 rounded-2xl px-4 py-3 text-lg font-bold text-slate-100 placeholder:text-slate-700 focus:outline-none focus:border-cyan-400/70 focus:ring-1 focus:ring-cyan-400/40 transition-all text-center"
                  />
                  <span class="absolute right-3 top-3.5 text-[10px] font-mono text-slate-600">mmHg</span>
                </div>
              </div>

              <div>
                <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1.5">Diastolic (Bottom)</label>
                <div class="relative">
                  <input 
                    type="number" 
                    id="input-dia" 
                    placeholder="80" 
                    inputmode="numeric" 
                    onfocus="this.value = ''" 
                    required
                    class="w-full bg-slate-950/70 border border-slate-700/80 rounded-2xl px-4 py-3 text-lg font-bold text-slate-100 placeholder:text-slate-700 focus:outline-none focus:border-cyan-400/70 focus:ring-1 focus:ring-cyan-400/40 transition-all text-center"
                  />
                  <span class="absolute right-3 top-3.5 text-[10px] font-mono text-slate-600">mmHg</span>
                </div>
              </div>
            </div>

            <!-- Pulse Input with AutoClear -->
            <div>
              <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1.5">Pulse (Heart Rate)</label>
              <div class="relative">
                <input 
                  type="number" 
                  id="input-pulse" 
                  placeholder="72" 
                  inputmode="numeric" 
                  onfocus="this.value = ''" 
                  required
                  class="w-full bg-slate-950/70 border border-slate-700/80 rounded-2xl px-4 py-3 text-lg font-bold text-slate-100 placeholder:text-slate-700 focus:outline-none focus:border-cyan-400/70 focus:ring-1 focus:ring-cyan-400/40 transition-all text-center"
                />
                <span class="absolute right-3 top-3.5 text-[10px] font-mono text-slate-600">bpm</span>
              </div>
            </div>

            <!-- Notes -->
            <div>
              <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1.5">Notes / Symptoms</label>
              <input 
                type="text" 
                id="input-notes" 
                placeholder="e.g. Resting, morning, coffee, headache" 
                class="w-full bg-slate-950/70 border border-slate-700/80 rounded-2xl px-4 py-2.5 text-sm text-slate-200 placeholder:text-slate-700 focus:outline-none focus:border-cyan-400/70 transition-all"
              />
            </div>

            <button 
              type="submit" 
              class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-[0.98] rounded-2xl text-slate-950 font-bold uppercase tracking-wider text-xs shadow-lg shadow-cyan-950/50 transition-all mt-2"
            >
              Record Reading
            </button>
          </form>
        </div>

        <!-- Metric Summary Chips -->
        <div class="grid grid-cols-3 gap-2 pt-4 mt-6 border-t border-slate-800/80 text-center">
          <div class="bg-slate-950/40 p-2 rounded-xl border border-slate-800/50">
            <span class="text-[9px] font-mono text-slate-500 block uppercase">30-Day Mean</span>
            <span class="text-xs font-bold text-cyan-300" id="chip-mean">—</span>
          </div>
          <div class="bg-slate-950/40 p-2 rounded-xl border border-slate-800/50">
            <span class="text-[9px] font-mono text-slate-500 block uppercase">Pulse Press</span>
            <span class="text-xs font-bold text-slate-200" id="chip-pp">—</span>
          </div>
          <div class="bg-slate-950/40 p-2 rounded-xl border border-slate-800/50">
            <span class="text-[9px] font-mono text-slate-500 block uppercase">MAP</span>
            <span class="text-xs font-bold text-slate-200" id="chip-map">—</span>
          </div>
        </div>
      </section>

      <!-- Telemetry History Log -->
      <section class="md:col-span-7 bg-slate-900/50 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-5 shadow-2xl flex flex-col min-h-[420px]">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-mono uppercase tracking-widest text-slate-400 flex items-center gap-1.5">
            <i data-lucide="list" class="w-4 h-4 text-emerald-400"></i> Recorded History
          </h2>
          <span class="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full" id="log-count">0 Records</span>
        </div>

        <div id="readings-container" class="flex-1 space-y-2 overflow-y-auto max-h-[500px] pr-1 custom-scrollbar">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </main>
  </div>

  <!-- Hidden Off-Screen Report Container for window.print() -->
  <div id="clinical-report-root"></div>
  <div id="toast-container"></div>

  <script>
    // 1. Storage Architecture: Safe fallback to preserve all user records
    let currentStorageKey = 'pulseguard_readings';
    const candidateKeys = ['pulseguard_readings', 'bp_readings', 'cardio_readings'];

    function loadPersistedReadings() {
      for (const k of candidateKeys) {
        const raw = localStorage.getItem(k);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              currentStorageKey = k;
              return parsed;
            }
          } catch(e) {}
        }
      }
      return [];
    }

    let state = {
      readings: loadPersistedReadings()
    };

    function persist() {
      try {
        const payload = JSON.stringify(state.readings);
        localStorage.setItem(currentStorageKey, payload);
        // Secondary backup sync across alternate keys
        localStorage.setItem('bp_readings', payload);
      } catch (err) {
        console.error('Storage write error:', err);
      }
    }

    // 2. Classification Engine
    function classifyBP(sys, dia) {
      if (sys >= 140 || dia >= 90) {
        return { label: 'STAGE 2', color: 'text-red-400', bg: 'bg-red-500/10', border: 'border-red-500/30' };
      }
      if (sys >= 130 || dia >= 80) {
        return { label: 'STAGE 1', color: 'text-amber-400', bg: 'bg-amber-500/10', border: 'border-amber-500/30' };
      }
      if (sys >= 120 && dia < 80) {
        return { label: 'ELEVATED', color: 'text-yellow-300', bg: 'bg-yellow-500/10', border: 'border-yellow-500/30' };
      }
      return { label: 'NORMAL', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30' };
    }

    // 3. UI Renderer
    function renderApp() {
      const container = document.getElementById('readings-container');
      const countBadge = document.getElementById('log-count');
      countBadge.innerText = `${state.readings.length} Records`;

      if (state.readings.length === 0) {
        container.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-slate-600 text-center">
            <i data-lucide="clipboard-list" class="w-10 h-10 mb-2 opacity-30"></i>
            <p class="text-xs font-mono uppercase tracking-widest">No readings logged yet.</p>
          </div>
        `;
        document.getElementById('chip-mean').innerText = '—';
        document.getElementById('chip-pp').innerText = '—';
        document.getElementById('chip-map').innerText = '—';
        lucide.createIcons();
        return;
      }

      // Sort newest first
      const sorted = [...state.readings].sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));

      // Calculate Chips
      const avgSys = Math.round(sorted.reduce((acc, r) => acc + Number(r.systolic), 0) / sorted.length);
      const avgDia = Math.round(sorted.reduce((acc, r) => acc + Number(r.diastolic), 0) / sorted.length);
      const pp = avgSys - avgDia;
      const mapVal = Math.round(avgDia + (pp / 3));

      document.getElementById('chip-mean').innerText = `${avgSys}/${avgDia}`;
      document.getElementById('chip-pp').innerText = `${pp} mmHg`;
      document.getElementById('chip-map').innerText = `${mapVal} mmHg`;

      container.innerHTML = sorted.map(r => {
        const tier = classifyBP(Number(r.systolic), Number(r.diastolic));
        const dt = new Date(r.timestamp || r.date);
        const dateStr = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const timeStr = dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="p-3 bg-slate-950/40 border border-slate-800/80 rounded-2xl flex items-center justify-between gap-3 hover:border-slate-700 transition-colors">
            <div class="flex items-center gap-3">
              <div class="flex flex-col">
                <span class="text-xs font-bold text-white">${dateStr}</span>
                <span class="text-[10px] font-mono text-slate-500">${timeStr}</span>
              </div>
              <div>
                <div class="text-base font-extrabold text-slate-100 flex items-center gap-2">
                  ${r.systolic} / ${r.diastolic}
                  <span class="text-[9px] font-mono font-bold px-1.5 py-0.5 rounded-full border ${tier.bg} ${tier.color} ${tier.border}">
                    ${tier.label}
                  </span>
                </div>
                <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                  <span class="font-mono text-cyan-400">${r.pulse} bpm</span>
                  ${r.notes ? `<span class="text-slate-500 truncate max-w-[180px]">• ${r.notes}</span>` : ''}
                </div>
              </div>
            </div>
            <button onclick="removeReading('${r.id}')" class="p-2 text-slate-500 hover:text-red-400 rounded-lg transition-colors">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 4. Save & Delete Handlers
    function handleSaveReading(e) {
      e.preventDefault();
      const sys = parseInt(document.getElementById('input-sys').value, 10);
      const dia = parseInt(document.getElementById('input-dia').value, 10);
      const pulse = parseInt(document.getElementById('input-pulse').value, 10);
      const notes = document.getElementById('input-notes').value.trim();

      if (isNaN(sys) || isNaN(dia) || isNaN(pulse)) return;

      const newRecord = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        systolic: sys,
        diastolic: dia,
        pulse: pulse,
        notes: notes,
        timestamp: new Date().toISOString()
      };

      state.readings.unshift(newRecord);
      persist();

      // Reset inputs & reset focus
      document.getElementById('input-sys').value = '';
      document.getElementById('input-dia').value = '';
      document.getElementById('input-pulse').value = '';
      document.getElementById('input-notes').value = '';
      document.getElementById('input-sys').focus();

      renderApp();
    }

    window.removeReading = function(id) {
      state.readings = state.readings.filter(r => r.id !== id);
      persist();
      renderApp();
    };

    // 5. Clinical Single-Page Report Generator (Physician PDF View)
    window.exportClinicalPDF = function() {
      if (!state.readings || state.readings.length === 0) {
        alert('No readings recorded to compile into a report.');
        return;
      }

      // Sort chronologically (oldest to newest)
      const sorted = [...state.readings].sort((a, b) => new Date(a.timestamp || a.date) - new Date(b.timestamp || b.date));

      // Filter to past 30 days (fallback to all records if fewer than 30 days)
      const thirtyDaysAgo = new Date(Date.now() - (30 * 24 * 60 * 60 * 1000));
      const recent = sorted.filter(r => new Date(r.timestamp || r.date) >= thirtyDaysAgo);
      const data = recent.length > 0 ? recent : sorted;
      const total = data.length;

      // Hemodynamic Averages
      const avgSys = Math.round(data.reduce((acc, r) => acc + Number(r.systolic), 0) / total);
      const avgDia = Math.round(data.reduce((acc, r) => acc + Number(r.diastolic), 0) / total);
      const avgPulse = Math.round(data.reduce((acc, r) => acc + Number(r.pulse || 0), 0) / total);

      // AM (04:00 - 11:59) vs PM (12:00 - 03:59)
      const amLogs = data.filter(r => {
        const h = new Date(r.timestamp || r.date).getHours();
        return h >= 4 && h < 12;
      });
      const pmLogs = data.filter(r => {
        const h = new Date(r.timestamp || r.date).getHours();
        return h >= 12 || h < 4;
      });

      const amAvg = amLogs.length ? `${Math.round(amLogs.reduce((a,b)=>a+Number(b.systolic),0)/amLogs.length)}/${Math.round(amLogs.reduce((a,b)=>a+Number(b.diastolic),0)/amLogs.length)}` : '—';
      const pmAvg = pmLogs.length ? `${Math.round(pmLogs.reduce((a,b)=>a+Number(b.systolic),0)/pmLogs.length)}/${Math.round(pmLogs.reduce((a,b)=>a+Number(b.diastolic),0)/pmLogs.length)}` : '—';

      // Vascular Metrics & Extremes
      const pulsePressure = avgSys - avgDia;
      const mapVal = Math.round(avgDia + (pulsePressure / 3));

      const maxSys = Math.max(...data.map(r => Number(r.systolic)));
      const minSys = Math.min(...data.map(r => Number(r.systolic)));
      const maxDia = Math.max(...data.map(r => Number(r.diastolic)));
      const minDia = Math.min(...data.map(r => Number(r.diastolic)));

      // AHA Distribution
      let normalCount = 0, elevatedCount = 0, stage1Count = 0, stage2Count = 0;
      data.forEach(r => {
        const s = Number(r.systolic);
        const d = Number(r.diastolic);
        if (s >= 140 || d >= 90) stage2Count++;
        else if (s >= 130 || d >= 80) stage1Count++;
        else if (s >= 120 && d < 80) elevatedCount++;
        else normalCount++;
      });
      const pct = count => Math.round((count / total) * 100);

      // Date Range String
      const formatDate = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const dateRangeStr = `${formatDate(data[0].timestamp || data[0].date)} – ${formatDate(data[data.length - 1].timestamp || data[data.length - 1].date)}`;

      // Reading Log Rows (Newest first)
      const logRows = [...data].reverse().map(r => {
        const dt = new Date(r.timestamp || r.date);
        const dateStr = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const timeStr = dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const s = Number(r.systolic);
        const d = Number(r.diastolic);

        const isStage2 = s >= 140 || d >= 90;
        const isStage1 = (s >= 130 || d >= 80) && !isStage2;

        let bpColor = '#0f172a';
        let flag = '';
        if (isStage2) {
          bpColor = '#b91c1c';
          flag = ' ⚠️';
        } else if (isStage1) {
          bpColor = '#d97706';
        }

        return `
          <tr style="border-bottom: 1px solid #e2e8f0; font-size: 10px;">
            <td style="padding: 3.5px 6px; font-weight: 600;">${dateStr}</td>
            <td style="padding: 3.5px 6px; color: #64748b;">${timeStr}</td>
            <td style="padding: 3.5px 6px; font-weight: 700; color: ${bpColor};">
              ${s} / ${d}${flag}
            </td>
            <td style="padding: 3.5px 6px; color: #334155;">${r.pulse ? `${r.pulse} bpm` : '—'}</td>
            <td style="padding: 3.5px 6px; color: #64748b; font-style: italic;">${r.notes || '—'}</td>
          </tr>
        `;
      }).join('');

      // Render Off-Screen Medical DOM
      const root = document.getElementById('clinical-report-root');
      root.innerHTML = `
        <div style="max-width: 7.5in; margin: 0 auto; color: #0f172a;">
          
          <!-- Header -->
          <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin-bottom: 10px;">
            <div>
              <h1 style="margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em;">Richard Gaitan</h1>
              <p style="margin: 2px 0 0 0; font-size: 11px; color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;">Cardiovascular Self-Monitoring Report</p>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 12px; font-weight: 700;">${dateRangeStr}</div>
              <div style="font-size: 10px; color: #64748b; margin-top: 1px;">Total Entries: <strong>${total}</strong></div>
            </div>
          </div>

          <!-- Summary Split Block -->
          <div style="display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; margin-bottom: 12px;">
            
            <!-- Left: Hemodynamic Indicators -->
            <div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; background: #f8fafc;">
              <div style="font-size: 9px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;">Hemodynamic & Circadian Overview</div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px;">
                <div>
                  <span style="color: #64748b; font-size: 10px;">30-Day Mean:</span>
                  <div style="font-size: 15px; font-weight: 800; color: #0f172a;">${avgSys} / ${avgDia} <span style="font-size: 9px; font-weight: 500;">mmHg</span></div>
                </div>
                <div>
                  <span style="color: #64748b; font-size: 10px;">Mean Pulse:</span>
                  <div style="font-size: 15px; font-weight: 800; color: #0f172a;">${avgPulse} <span style="font-size: 9px; font-weight: 500;">bpm</span></div>
                </div>
                <div style="grid-column: span 2; border-top: 1px solid #e2e8f0; padding-top: 4px; margin-top: 2px;">
                  <span style="color: #64748b; font-size: 10px;">Circadian Dipping:</span>
                  <div style="font-weight: 700; color: #0f172a; margin-top: 1px;">
                    AM (04-12h): <strong>${amAvg}</strong> <span style="color: #94a3b8; margin: 0 4px;">|</span> PM (12-04h): <strong>${pmAvg}</strong>
                  </div>
                </div>
                <div style="grid-column: span 2; border-top: 1px solid #e2e8f0; padding-top: 4px;">
                  <span style="color: #64748b; font-size: 10px;">Vascular Indicators & Extremes:</span>
                  <div style="font-weight: 600; color: #334155; margin-top: 1px; font-size: 10px;">
                    Pulse Press: <strong>${pulsePressure} mmHg</strong> <span style="color: #94a3b8; margin: 0 3px;">•</span> MAP: <strong>${mapVal} mmHg</strong>
                  </div>
                  <div style="color: #475569; font-size: 10px; margin-top: 2px;">
                    Peak: <span style="color: #b91c1c; font-weight: 700;">${maxSys}/${maxDia}</span> <span style="color: #94a3b8; margin: 0 3px;">•</span> Low: <span style="color: #15803d; font-weight: 700;">${minSys}/${minDia}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right: AHA Distribution -->
            <div style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; background: #ffffff;">
              <div style="font-size: 9px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;">AHA Category Distribution</div>
              <table style="width: 100%; border-collapse: collapse; font-size: 10px; text-align: left;">
                <thead>
                  <tr style="border-bottom: 1px solid #cbd5e1; color: #64748b; font-size: 8.5px; text-transform: uppercase;">
                    <th style="padding: 2px 0;">Tier</th>
                    <th style="padding: 2px 0;">Range (mmHg)</th>
                    <th style="padding: 2px 0; text-align: right;">%</th>
                    <th style="padding: 2px 0; text-align: right;">Count</th>
                  </tr>
                </thead>
                <tbody>
                  <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 3px 0; font-weight: 700; color: #15803d;">Normal</td>
                    <td style="padding: 3px 0; color: #64748b;">&lt; 120 and &lt; 80</td>
                    <td style="padding: 3px 0; text-align: right; font-weight: 700;">${pct(normalCount)}%</td>
                    <td style="padding: 3px 0; text-align: right; color: #64748b;">${normalCount}</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 3px 0; font-weight: 700; color: #475569;">Elevated</td>
                    <td style="padding: 3px 0; color: #64748b;">120-129 and &lt; 80</td>
                    <td style="padding: 3px 0; text-align: right; font-weight: 700;">${pct(elevatedCount)}%</td>
                    <td style="padding: 3px 0; text-align: right; color: #64748b;">${elevatedCount}</td>
                  </tr>
                  <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 3px 0; font-weight: 700; color: #d97706;">Stage 1</td>
                    <td style="padding: 3px 0; color: #64748b;">130-139 or 80-89</td>
                    <td style="padding: 3px 0; text-align: right; font-weight: 700;">${pct(stage1Count)}%</td>
                    <td style="padding: 3px 0; text-align: right; color: #64748b;">${stage1Count}</td>
                  </tr>
                  <tr>
                    <td style="padding: 3px 0; font-weight: 700; color: #b91c1c;">Stage 2</td>
                    <td style="padding: 3px 0; color: #64748b;">≥ 140 or ≥ 90</td>
                    <td style="padding: 3px 0; text-align: right; font-weight: 700;">${pct(stage2Count)}%</td>
                    <td style="padding: 3px 0; text-align: right; color: #64748b;">${stage2Count}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Log Table -->
          <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
              <tr style="border-bottom: 1.5px solid #0f172a; font-size: 8.5px; text-transform: uppercase; color: #475569;">
                <th style="padding: 3px 6px;">Date</th>
                <th style="padding: 3px 6px;">Time</th>
                <th style="padding: 3px 6px;">BP (mmHg)</th>
                <th style="padding: 3px 6px;">Pulse</th>
                <th style="padding: 3px 6px;">Notes / Context</th>
              </tr>
            </thead>
            <tbody>
              ${logRows}
            </tbody>
          </table>
        </div>
      `;

      // Trigger iOS Print / Save as PDF
      window.print();
    };

    // Initial render
    renderApp();
  </script>
</body>
</html>
